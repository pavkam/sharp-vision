name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore .NET packages
        run: dotnet restore SharpVision.slnx

      - name: Install Node.js packages
        run: npm ci

      - name: Check C# formatting and analyzers
        run: dotnet format SharpVision.slnx --verify-no-changes --no-restore --verbosity diagnostic

      - name: Check Markdown formatting
        run: npm run format:check

      - name: Lint Markdown
        run: npm run lint:markdown

      - name: Validate documentation links
        run: npm run lint:links

      - name: Test documentation tooling
        run: npm run test:docs

      - name: Build
        run: dotnet build SharpVision.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution SharpVision.slnx --configuration Release --no-build --minimum-expected-tests 3 --timeout 60s --report-xunit-trx

      - name: Verify isolated package consumer
        run: scripts/verify-package-consumer.sh
