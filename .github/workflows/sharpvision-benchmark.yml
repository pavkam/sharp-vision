name: ⏱️ Benchmark wall-clock performance

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharpvision-wall-clock-benchmark
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SHARPVISION_BENCHMARK_RUNNER: ubuntu-24.04
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  benchmark:
    name: ⏱️ Compare wall-clock performance
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: ☁️ Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⚙️ Set up repository
        uses: ./.github/actions/setup

      - name: ♻️ Restore benchmark baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/benchmarks/wall-clock-baseline.json
          key: wall-clock-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wall-clock-${{ runner.os }}-${{ runner.arch }}-

      - name: ⏱️ Measure and compare
        shell: bash
        run: make benchmark

      - name: 💾 Save benchmark baseline
        if: ${{ always() && hashFiles('artifacts/benchmarks/wall-clock-baseline.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/benchmarks/wall-clock-baseline.json
          key: wall-clock-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 📤 Upload benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wall-clock-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/benchmarks
          if-no-files-found: error
          retention-days: 30
