name: 🧪 Verify pull request

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  # TEMPORARY (#32 diagnosis). The crash reproduces on roughly one Linux run in three, so a single
  # verification leg carries almost no signal. This matrix runs the Linux leg five times in
  # parallel — about a 9-in-10 chance of catching at least one crash per push — with lint and the
  # Windows and macOS legs removed so each iteration lands in minutes. Restore the original
  # single-run, three-platform shape before merging.
  verify-linux:
    name: 🧪 Verify on Linux (${{ matrix.attempt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5]

    steps:
      - name: ☁️ Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⚙️ Set up repository
        uses: ./.github/actions/setup

      - name: ⏯️ Build and test
        uses: ./.github/actions/build-and-test
        with:
          artifact-suffix: -${{ matrix.attempt }}
          skip-lint: "true"

  summary:
    name: ✔️ Generate verification summary
    needs: [verify-linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: 📝 Write summary
        shell: bash
        run: |
          result="${{ needs.verify-linux.result }}"
          {
            echo "## 🧪 Verification summary"
            echo
            echo "| Lane | Status |"
            echo "| --- | --- |"
            echo "| Linux ×5 (#32 crash-repro matrix) | $result |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$result" != "success" ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "❌ At least one Linux attempt failed. Check the per-attempt job logs." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
