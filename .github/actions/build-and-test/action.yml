name: 🧪 Build and test SharpVision
description: Run the repository quality gates and publish test coverage artifacts.

inputs:
  configuration:
    description: Build configuration.
    required: false
    default: Release
  coverage-report-path:
    description: Coverage report output directory.
    required: false
    default: coverage-report

runs:
  using: composite
  steps:
    - name: 🔍 Lint and documentation checks
      shell: bash
      run: make lint

    - name: 🛠️ Build
      shell: bash
      run: make build CONFIGURATION=${{ inputs.configuration }}

    - name: 🧪 Test with coverage
      shell: bash
      run: make test-ci CONFIGURATION=${{ inputs.configuration }}

    - name: 🧪 Test controlling-terminal Unix console host
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: make test-tty CONFIGURATION=${{ inputs.configuration }}

    - name: 📊 Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@7a0988e399533f3680a732dceda1a967cafdafcd # 5.2.3
      with:
        reports: "**/TestResults/**/*.cobertura.xml"
        targetdir: ${{ inputs.coverage-report-path }}
        reporttypes: HtmlInline;Cobertura;Badges

    - name: 📤 Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-results-${{ runner.os }}
        path: "**/TestResults/**/*.trx"
        if-no-files-found: error

    - name: 📤 Upload coverage report
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report-${{ runner.os }}
        path: ${{ inputs.coverage-report-path }}
        if-no-files-found: warn

    - name: 📋 Publish test results
      if: ${{ always() && runner.os == 'Linux' }}
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
      with:
        check_name: "📋 Test results on ${{ runner.os }}"
        files: "**/TestResults/**/*.trx"
        action_fail: true
        action_fail_on_inconclusive: true
