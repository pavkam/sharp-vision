name: 🧪 Build and test SharpVision
description: >-
  Build, test, and publish coverage artifacts. Linting is deliberately not part of this action: it
  is platform-independent and takes about as long as the test phase, so it runs as its own parallel
  job instead of serially inside every platform leg.

inputs:
  configuration:
    description: Build configuration.
    required: false
    default: Release
  coverage-report-path:
    description: Coverage report output directory.
    required: false
    default: coverage-report
  codecov-token:
    description: >-
      Codecov upload token. A composite action cannot read `secrets` itself, so the calling
      workflow passes `secrets.CODECOV_TOKEN` through here. Pull requests from forks receive an
      empty value because secrets are withheld from them; the uploader then falls back to the
      tokenless path Codecov permits for public repositories.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 🛠️ Build
      shell: bash
      run: make build CONFIGURATION=${{ inputs.configuration }}

    - name: 🧪 Test with coverage
      shell: bash
      run: make test-ci CONFIGURATION=${{ inputs.configuration }}

    - name: 🧪 Test controlling-terminal Unix console host
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: make test-tty CONFIGURATION=${{ inputs.configuration }}

    - name: 📊 Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@7a0988e399533f3680a732dceda1a967cafdafcd # 5.2.3
      with:
        reports: "**/TestResults/**/*.cobertura.xml"
        targetdir: ${{ inputs.coverage-report-path }}
        reporttypes: HtmlInline;Cobertura;Badges

    # Uploads the single Cobertura file ReportGenerator merged from the per-project runs above,
    # not the raw per-project files, so Codecov receives one deterministic report per platform and
    # search is disabled so a stray coverage file elsewhere in the workspace cannot be picked up.
    # Each leg is tagged with its platform flag; Codecov merges the three so platform-specific code
    # covered on only one operating system still counts. An upload failure fails the leg: the
    # 90 percent floor is enforced from this data, and a silently missing upload would let the
    # status be computed from an incomplete report.
    - name: ☂️ Upload coverage to Codecov
      uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
      with:
        token: ${{ inputs.codecov-token }}
        files: ${{ inputs.coverage-report-path }}/Cobertura.xml
        disable_search: true
        flags: ${{ runner.os }}
        name: ${{ runner.os }}
        fail_ci_if_error: true
        verbose: false

    - name: 📤 Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-results-${{ runner.os }}
        path: "**/TestResults/**/*.trx"
        if-no-files-found: error

    - name: 📤 Upload coverage report
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report-${{ runner.os }}
        path: ${{ inputs.coverage-report-path }}
        if-no-files-found: warn

    - name: 📋 Publish test results
      if: ${{ always() && runner.os == 'Linux' }}
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
      with:
        check_name: "📋 Test results on ${{ runner.os }}"
        files: "**/TestResults/**/*.trx"
        action_fail: true
        action_fail_on_inconclusive: true
