name: 🧪 Build and test SharpVision
description: Run the repository quality gates and publish test coverage artifacts.

inputs:
  configuration:
    description: Build configuration.
    required: false
    default: Release
  coverage-report-path:
    description: Coverage report output directory.
    required: false
    default: coverage-report

runs:
  using: composite
  steps:
    - name: 🔍 Lint and documentation checks
      id: lint
      # TEMPORARY: disabled to iterate faster on the Windows ConPTY hang (issue #35). Revert before merge.
      if: false
      shell: bash
      continue-on-error: true
      run: make lint

    - name: 🛠️ Build
      shell: bash
      run: make build CONFIGURATION=${{ inputs.configuration }}

    - name: 🧪 Test with coverage
      shell: bash
      # TEMPORARY: scoped to only the ConPTY tests to iterate faster on the Windows hang
      # (issue #35). Revert to `make test-ci CONFIGURATION=${{ inputs.configuration }}` before merge.
      run: |
        dotnet test --project tests/SharpVision.Terminal.Tests \
          --configuration ${{ inputs.configuration }} --no-build \
          --filter-query "/*/*/WindowsConsoleHostConPtyTests/*" --timeout 300s --report-xunit-trx

    - name: 🧪 Test controlling-terminal Unix console host
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: make test-tty CONFIGURATION=${{ inputs.configuration }}

    - name: 📊 Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@7a0988e399533f3680a732dceda1a967cafdafcd # 5.2.3
      with:
        reports: "**/TestResults/**/*.cobertura.xml"
        targetdir: ${{ inputs.coverage-report-path }}
        reporttypes: HtmlInline;Cobertura;Badges

    - name: 📤 Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-results-${{ runner.os }}
        path: "**/TestResults/**/*.trx"
        if-no-files-found: error

    - name: 📤 Upload coverage report
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report-${{ runner.os }}
        path: ${{ inputs.coverage-report-path }}
        if-no-files-found: warn

    - name: 📋 Publish test results
      if: ${{ always() && runner.os == 'Linux' }}
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
      with:
        check_name: "📋 Test results on ${{ runner.os }}"
        files: "**/TestResults/**/*.trx"
        action_fail: true
        action_fail_on_inconclusive: true

    - name: 🔍 Enforce lint result
      if: ${{ always() && steps.lint.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::error::make lint failed. Formatting and documentation gates do not veto build, test, coverage, or compatibility checks, but the job still fails overall — see the '🔍 Lint and documentation checks' step above for details."
        exit 1
