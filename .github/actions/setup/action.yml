name: ⚙️ Set up SharpVision
description: Install the repository toolchain and cache restore dependencies.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: 10.0.x
  node-version:
    description: Node.js version to install.
    required: false
    default: 24.x

runs:
  using: composite
  steps:
    - name: ⚙️ Set up .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: ⚙️ Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: ♻️ Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-dotnet-

    # windows-latest has no GNU Make preinstalled. The Makefile stays the single source of
    # truth for how tests run on every platform (see issue #35), so this installs the same
    # `make` the other lanes already have rather than adding a second, hand-maintained command
    # surface for Windows.
    - name: ⚙️ Install make (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: choco install make --no-progress -y

    - name: 📦 Restore repository dependencies
      shell: bash
      # `make` on Windows (installed via choco above) re-execs each recipe line through its own
      # MSYS2 shell, distinct from the Git-for-Windows bash running this step. That MSYS2 shell
      # rewrites POSIX-looking values into Windows paths at the point it launches a native (non-
      # MSYS) child process like dotnet.exe -- and it does this for BOTH command-line arguments
      # (MSYS2_ARG_CONV_EXCL) AND environment variable values (MSYS2_ENV_CONV_EXCL), which are two
      # separate conversion passes. The Makefile now passes the NuGet source URL to dotnet via the
      # NUGET_ORG environment variable specifically to dodge the argument-conversion pass, but that
      # alone still left the URL's *value* mangled by the environment-conversion pass (observed
      # directly on Windows CI: "D:\...\https:\api.nuget.org\v3\index.json"). Setting all three
      # exclusion variables covers Git's own bash (MSYS_NO_PATHCONV) and both of make's nested
      # MSYS2 conversion passes. No-op on Linux/macOS.
      env:
        MSYS_NO_PATHCONV: 1
        MSYS2_ARG_CONV_EXCL: "*"
        MSYS2_ENV_CONV_EXCL: "*"
      run: make restore
