name: ⚙️ Set up SharpVision
description: Install the repository toolchain and cache restore dependencies.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: 10.0.x
  node-version:
    description: Node.js version to install.
    required: false
    default: 24.x

runs:
  using: composite
  steps:
    - name: ⚙️ Set up .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: ⚙️ Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: ♻️ Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-dotnet-

    # windows-latest has no GNU Make preinstalled. The Makefile stays the single source of
    # truth for how tests run on every platform (see issue #35), so this installs the same
    # `make` the other lanes already have rather than adding a second, hand-maintained command
    # surface for Windows.
    - name: ⚙️ Install make (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: choco install make --no-progress -y

    - name: 📦 Restore repository dependencies
      shell: bash
      # `make` on Windows (installed via choco above) re-execs each recipe line through its own
      # MSYS2 shell, distinct from the Git-for-Windows bash running this step, which auto-converts
      # POSIX-looking command-line arguments to Windows paths and mangles the plain https:// NuGet
      # source URL into a local path (observed directly on Windows CI:
      # "D:\...\https:\api.nuget.org\v3\index.json"). MSYS_NO_PATHCONV disables that conversion for
      # Git's own bash (this step's shell) but not for make's nested MSYS2 shell, which honors the
      # real MSYS2 variable MSYS2_ARG_CONV_EXCL instead -- set both so the whole chain is covered.
      # No-op on Linux/macOS.
      env:
        MSYS_NO_PATHCONV: 1
        MSYS2_ARG_CONV_EXCL: "*"
      run: make restore
